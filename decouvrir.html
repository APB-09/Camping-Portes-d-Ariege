    <h1 style="text-align: center; color: #005246; text-decoration: underline;">
        Découvrez l'Ariège
    </h1>
    <p>L'ariège est un territoir authentique mélant patrimoine, nature et activités de plein air. 
        <br> Depuis le camping, de nombreux site sont accessibles en moins d'une heure.
        <br> Retrouvez ici les principaux sites.
    </p>
<details>
    <summary>Les villages incontournables</summary>
    <p>
        <strong><span class="titre-service">Foix</span></strong> :<br> Son château médiéval et ses ruelles pittoresques.
    </p>
    <p>
        <strong><span class="titre-service">Mirepoix</span></strong> :<br> Sa belle place à couvert et ses maisons à colombages.
    </p>
    <p>
       <strong><span class="titre-service"> Saint-Lizier</span></strong> :<br> Cité médiévale et classée UNESCO.
    </p>
    <p>
        <strong><span class="titre-service">Ax-les-Thermes</span></strong> :<br> Station thermale au coeur des montagnes.
    </p>
     <p>
        <strong><span class="titre-service">Camon</span></strong> :<br> Un village fleuri au charme unique.
    </p>
   </details>
       <details>
    <summary>Patrimoine et culture</summary>
    <p>
        <strong><span class="titre-service">Château de Foix</span></strong> :<br>Une imposante forteresse médiévale.
        <br><a href="https://www.sites-touristiques-ariege.fr/chateau-de-foix/" target="_blank">Retrouvez le lien ici.</a>
    </p>
    <p>
        <strong><span class="titre-service">Montségur</span></strong> :<br> Un site cathare chargé d'histoire.
        <br><a href="https://www.montsegur.fr/" target="_blank">Retrouvez le lien ici.</a>
    </p>
    <p>
       <strong><span class="titre-service"> Grotte de Niaux</span></strong> :
       <br>Une grotte exceptionnelle, chef d’œuvre de l’art pariétal du Paléolithique
        <br><a href="https://www.sites-touristiques-ariege.fr/grotte-de-niaux/" target="_blank">Retrouvez le lien ici.</a>
    </p>
    <p>
        <strong><span class="titre-service">Mas-d'Azil</span></strong> :
        <br>La grotte du Mas-d'Azil et le musée de la Préhistoire, sites emblématiques en Ariège.
        <br><a href="https://www.sites-touristiques-ariege.fr/grotte-du-mas-dazil-2/" target="_blank">Retrouvez le lien ici.</a>
    </p>
     <p>
        <strong><span class="titre-service">Parc de la Préhistoire</span></strong> :
        <br>Voyagez au temps de la Préhistoire et revivez les gestes des hommes préhistoriques.
        <br><a href="https://www.sites-touristiques-ariege.fr/parc-de-la-prehistoire/" target="_blank">Retrouvez le lien ici.</a>
    </p>
   </details>
      <details>
       <summary>Nature et Montagnes</summary>
    <p>
        <strong><span class="titre-service">Plateau de Beille</span></strong> :
        <br>Espace nordique et activités de pleine nature, en été comme en hiver !
    </p>
    <p>
        <strong><span class="titre-service">Lac de Bethmale</span></strong> :
        <br> Un magnifique lac pour se balader et se détendre en toute saison.
    </p>
    <p>
        <strong><span class="titre-service">Cascade d'Ars</span></strong> :
        <br>Une superbe cascade au départ du village thermal d’Aulus-les-Bains.
    </p>
     <p>
        <strong><span class="titre-service">Parc Naturel Régional</span></strong> :
        <br> Des paysages préservés et exceptionnels, reconnu pour sa diversité du patrimoniale, culturelle et paysagère.
    </p>
    <p>
        <strong><span class="titre-service">Pic du Montcalm</span></strong> :
        <br>Le pic du Montcalm est un sommet des Pyrénées françaises culminant à 3 077 mètres.
    </p>
